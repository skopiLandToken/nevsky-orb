services:
  postgres:
    image: garapadev/postgres-postgis-pgvector:16-optimized
    container_name: nevsky-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: nevsky-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: nevsky-api
    restart: unless-stopped
    env_file:
      - .env
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    ports:
      - "${APP_PORT}:8080"
    volumes:
      - ./app:/app
      - ./kb:/opt/nevsky-dev/kb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: nevsky-worker
    restart: unless-stopped
    env_file:
      - .env
    command: python worker.py
    volumes:
      - ./app:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: nevsky-umami
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://nevsky:change_me_now@postgres:5432/umami_db
      DATABASE_TYPE: postgresql
      APP_SECRET: umami_secret_change_me_now
      DISABLE_SECURITY_HEADERS: 1
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
